services:
  postgres-payments:
    image: postgres:15.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAYMENTS_PG_DB}
      POSTGRES_USER: ${PAYMENTS_PG_USER}
      POSTGRES_PASSWORD: ${PAYMENTS_PG_PASSWORD}
    volumes:
      - postgres_payments_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENTS_PG_USER} -d ${PAYMENTS_PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [arm_net]

  postgres-cars:
    image: postgres:15.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CARS_PG_DB}
      POSTGRES_USER: ${CARS_PG_USER}
      POSTGRES_PASSWORD: ${CARS_PG_PASSWORD}
    volumes:
      - postgres_cars_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CARS_PG_USER} -d ${CARS_PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [arm_net]

  postgres-chats:
    image: postgres:15.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CHATS_PG_DB}
      POSTGRES_USER: ${CHATS_PG_USER}
      POSTGRES_PASSWORD: ${CHATS_PG_PASSWORD}
    volumes:
      - postgres_chats_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHATS_PG_USER} -d ${CHATS_PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [arm_net]

  postgres-users:
    image: postgres:15.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${USERS_PG_DB}
      POSTGRES_USER: ${USERS_PG_USER}
      POSTGRES_PASSWORD: ${USERS_PG_PASSWORD}
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_PG_USER} -d ${USERS_PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [arm_net]

  migrate-cars:
    image: ghcr.io/arm-auto-place/migrations-cars:v0.0.0-1
    platform: linux/amd64
    restart: "no"
    environment:
      PG_ADDRESS: postgres-cars:5432
      PG_DB: ${CARS_PG_DB}
      PG_USER: ${CARS_PG_USER}
      PG_PASSWORD: ${CARS_PG_PASSWORD}
      MIGRATION_DIR: ${CARS_MIGRATION_DIR}
    depends_on:
      postgres-cars:
        condition: service_healthy
    networks: [arm_net]

  migrate-users:
    image: ghcr.io/arm-auto-place/migrations-users:v0.0.0-1
    platform: linux/amd64
    restart: "no"
    environment:
      PG_ADDRESS: postgres-users:5432
      PG_DB: ${USERS_PG_DB}
      PG_USER: ${USERS_PG_USER}
      PG_PASSWORD: ${USERS_PG_PASSWORD}
      MIGRATION_DIR: ${USERS_MIGRATION_DIR}
    depends_on:
      postgres-users:
        condition: service_healthy
    networks: [arm_net]

  migrate-chats:
    image: ghcr.io/arm-auto-place/migrations-chats:v0.0.0-1
    platform: linux/amd64
    restart: "no"
    environment:
      PG_ADDRESS: postgres-chats:5432
      PG_DB: ${CHATS_PG_DB}
      PG_USER: ${CHATS_PG_USER}
      PG_PASSWORD: ${CHATS_PG_PASSWORD}
      MIGRATION_DIR: ${CHATS_MIGRATION_DIR}
    depends_on:
      postgres-chats:
        condition: service_healthy
    networks: [arm_net]

  migrate-payments:
    image: ghcr.io/arm-auto-place/migrations-payments:v0.0.0-1
    platform: linux/amd64
    restart: "no"
    environment:
      PG_ADDRESS: postgres-payments:5432
      PG_DB: ${PAYMENTS_PG_DB}
      PG_USER: ${PAYMENTS_PG_USER}
      PG_PASSWORD: ${PAYMENTS_PG_PASSWORD}
      MIGRATION_DIR: ${PAYMENTS_MIGRATION_DIR}
    depends_on:
      postgres-payments:
        condition: service_healthy
    networks: [arm_net]
